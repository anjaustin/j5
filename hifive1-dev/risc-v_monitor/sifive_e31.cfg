# SiFive E31 Core Config for OpenOCD

# J-Link interface
source [find interface/jlink.cfg]
transport select jtag

# RISC-V target
set WORKAREAMAX 0x4000

# Target: SiFive E31 (RV32IMAC)
jtag newtap e31 cpu -irlen 5 -expected-id 0x20000913

# RISC-V configuration
target create e31.cpu riscv -chain-position e31.cpu

# Flash programming
flash bank flash0 efm32 0x20000000 0 0 0 $_TARGETNAME
